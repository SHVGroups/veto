{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.masterKey }}{{ fail "secrets.masterKey is required: generate one with `vetod keygen`" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veto.secretName" . }}
  labels: {{- include "veto.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ .Values.secrets.masterKey | quote }}
  master-key-previous: {{ .Values.secrets.masterKeyPrevious | quote }}
  jev-api-key: {{ .Values.secrets.jevApiKey | quote }}
  setup-token: {{ .Values.secrets.setupToken | quote }}
  metrics-token: {{ .Values.secrets.metricsToken | quote }}
  {{- if not .Values.database.existingSecret }}
  {{- if not .Values.database.url }}{{ fail "database.url or database.existingSecret is required" }}{{ end }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
