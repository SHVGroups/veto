[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shvgroups-veto"
version = "1.0.0"
description = "Python client for Veto, the approval layer between AI agents and the actions they take."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["ai", "agents", "approval", "guardrails", "mcp", "veto"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/shvgroups/veto"
Documentation = "https://github.com/shvgroups/veto/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/veto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
