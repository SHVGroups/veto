name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Each image is built natively on a machine of its own architecture (arm64
  # emulation is slow and unreliable for the console's Node build), pushed by
  # digest, then joined into one multi-architecture tag by the manifests job.
  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [server, console]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: server
            context: server
            file: server/Dockerfile
          - image: console
            context: .
            file: apps/console/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/shvgroups/veto
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=ghcr.io/shvgroups/veto-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Tag ${{ matrix.image }} image
    needs: images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [server, console]
    steps:
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-architecture tags
        working-directory: /tmp/digests
        run: |
          image=ghcr.io/shvgroups/veto-${{ matrix.image }}
          docker buildx imagetools create \
            -t "$image:${{ steps.version.outputs.version }}" \
            -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
      - name: Check the result
        run: docker buildx imagetools inspect ghcr.io/shvgroups/veto-${{ matrix.image }}:${{ steps.version.outputs.version }}

  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/shvgroups/veto/server/internal/app.Version=${GITHUB_REF_NAME#v}" \
            -o vetod-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/vetod
      - uses: softprops/action-gh-release@v2
        with:
          files: server/vetod-${{ matrix.goos }}-${{ matrix.goarch }}

  npm:
    name: Publish @shvgroups/veto to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (no token) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2
      - name: Check the version matches the tag
        working-directory: sdks/typescript
        run: test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
      - name: Skip if this version is already published
        id: published
        run: |
          if npm view "@shvgroups/veto@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.published.outputs.already != 'true'
        run: pnpm --filter @shvgroups/veto test
      - if: steps.published.outputs.already != 'true'
        run: pnpm --filter @shvgroups/veto build
      - name: Publish
        if: steps.published.outputs.already != 'true'
        working-directory: sdks/typescript
        run: npm publish --access public --provenance

  pypi:
    name: Publish shvgroups-veto to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the version matches the tag
        working-directory: sdks/python
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          # Re-running a release must not fail because this version is already up.
          skip-existing: true
